name: Feature request
description: An idea that would make Rain Cleaner more useful
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Rain Cleaner to do?
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else? (other programs that do it, screenshots)
